name: CivicFix CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies (Frontend)
      run: npm ci

    - name: Build Frontend
      run: npm run build

    - name: Install dependencies (Backend)
      working-directory: ./server
      run: npm ci
