services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: civicfix-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    ports:
      - "5000:5000"

  client:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: civicfix-client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server
