server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA routing support
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache immutable build assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Ensure the service worker can update promptly
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
}
